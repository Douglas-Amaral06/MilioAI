services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milioai}
      POSTGRES_DB: ${POSTGRES_DB:-milioai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-milioai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-milioai}}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_data:/data
    depends_on:
      db:
        condition: service_healthy
    init: true
volumes:
  postgres_data:
  private_data:
