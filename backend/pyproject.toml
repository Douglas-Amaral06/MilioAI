[project]
name = "milioai-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
 "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
 "pgvector>=0.3.6,<1", "langgraph>=1.0,<2", "httpx>=0.28,<1",
 "PyJWT[crypto]>=2.10,<3", "python-multipart>=0.0.20,<1", "pypdf>=6,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires migrated PostgreSQL with pgvector", "live: requires Ollama and PostgreSQL"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
"app.support" = ["*.json"]
